<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <!-- 8-bit Pixel Art Octofleet Logo - Busy Octopus -->
  <!-- Dark Background -->
  <rect width="128" height="128" fill="#0f172a"/>
  
  <!-- Octopus Head (amber/orange) -->
  <rect x="48" y="16" width="32" height="8" fill="#f59e0b"/>
  <rect x="40" y="24" width="48" height="8" fill="#f59e0b"/>
  <rect x="36" y="32" width="56" height="16" fill="#f59e0b"/>
  <rect x="40" y="48" width="48" height="8" fill="#f59e0b"/>
  
  <!-- Happy Eyes -->
  <rect x="44" y="36" width="8" height="8" fill="#ffffff"/>
  <rect x="76" y="36" width="8" height="8" fill="#ffffff"/>
  <rect x="46" y="38" width="4" height="4" fill="#1e293b"/>
  <rect x="78" y="38" width="4" height="4" fill="#1e293b"/>
  
  <!-- Smile -->
  <rect x="52" y="48" width="4" height="4" fill="#b45309"/>
  <rect x="56" y="50" width="16" height="4" fill="#b45309"/>
  <rect x="72" y="48" width="4" height="4" fill="#b45309"/>
  
  <!-- TENTACLE 1 (far left) - Holding Wrench (patching) -->
  <rect x="16" y="48" width="8" height="4" fill="#d97706"/>
  <rect x="12" y="52" width="8" height="8" fill="#d97706"/>
  <rect x="8" y="60" width="8" height="12" fill="#d97706"/>
  <rect x="4" y="72" width="8" height="8" fill="#d97706"/>
  <!-- Wrench -->
  <rect x="2" y="68" width="6" height="4" fill="#94a3b8"/>
  <rect x="0" y="66" width="4" height="8" fill="#64748b"/>
  
  <!-- TENTACLE 2 - Holding Server/Rack -->
  <rect x="24" y="52" width="8" height="4" fill="#f59e0b"/>
  <rect x="20" y="56" width="8" height="12" fill="#f59e0b"/>
  <rect x="16" y="68" width="8" height="16" fill="#f59e0b"/>
  <rect x="12" y="84" width="8" height="8" fill="#f59e0b"/>
  <!-- Server Rack -->
  <rect x="8" y="88" width="16" height="20" fill="#334155"/>
  <rect x="10" y="90" width="12" height="4" fill="#22d3ee"/>
  <rect x="10" y="96" width="12" height="4" fill="#22d3ee"/>
  <rect x="10" y="102" width="12" height="4" fill="#22d3ee"/>
  
  <!-- TENTACLE 3 - Holding Monitor (monitoring) -->
  <rect x="32" y="54" width="8" height="4" fill="#d97706"/>
  <rect x="28" y="58" width="8" height="12" fill="#d97706"/>
  <rect x="24" y="70" width="8" height="16" fill="#d97706"/>
  <rect x="20" y="86" width="8" height="12" fill="#d97706"/>
  <!-- Monitor with chart -->
  <rect x="16" y="98" width="20" height="16" fill="#1e293b"/>
  <rect x="18" y="100" width="16" height="12" fill="#0f172a"/>
  <!-- Chart line -->
  <rect x="20" y="108" width="2" height="2" fill="#22c55e"/>
  <rect x="22" y="106" width="2" height="2" fill="#22c55e"/>
  <rect x="24" y="104" width="2" height="2" fill="#22c55e"/>
  <rect x="26" y="106" width="2" height="2" fill="#22c55e"/>
  <rect x="28" y="102" width="2" height="2" fill="#22c55e"/>
  <rect x="30" y="104" width="2" height="2" fill="#22c55e"/>
  
  <!-- TENTACLE 4 - Holding Windows Logo -->
  <rect x="44" y="56" width="8" height="8" fill="#f59e0b"/>
  <rect x="40" y="64" width="8" height="16" fill="#f59e0b"/>
  <rect x="36" y="80" width="8" height="20" fill="#f59e0b"/>
  <!-- Windows Logo -->
  <rect x="32" y="100" width="16" height="16" fill="#0ea5e9"/>
  <rect x="40" y="100" width="2" height="16" fill="#0f172a"/>
  <rect x="32" y="108" width="16" height="2" fill="#0f172a"/>
  
  <!-- TENTACLE 5 - Holding Terminal -->
  <rect x="76" y="56" width="8" height="8" fill="#d97706"/>
  <rect x="80" y="64" width="8" height="16" fill="#d97706"/>
  <rect x="84" y="80" width="8" height="20" fill="#d97706"/>
  <!-- Terminal -->
  <rect x="80" y="100" width="20" height="16" fill="#1e293b"/>
  <rect x="82" y="102" width="16" height="12" fill="#0f172a"/>
  <rect x="84" y="104" width="2" height="2" fill="#22c55e"/>
  <rect x="86" y="106" width="6" height="2" fill="#22c55e"/>
  <rect x="84" y="110" width="8" height="2" fill="#64748b"/>
  
  <!-- TENTACLE 6 - Holding Network Cable -->
  <rect x="88" y="54" width="8" height="4" fill="#f59e0b"/>
  <rect x="92" y="58" width="8" height="12" fill="#f59e0b"/>
  <rect x="96" y="70" width="8" height="16" fill="#f59e0b"/>
  <rect x="100" y="86" width="8" height="12" fill="#f59e0b"/>
  <!-- Network plug -->
  <rect x="104" y="98" width="8" height="12" fill="#94a3b8"/>
  <rect x="106" y="100" width="4" height="4" fill="#22d3ee"/>
  <rect x="102" y="110" width="12" height="4" fill="#64748b"/>
  
  <!-- TENTACLE 7 - Holding Gear (config) -->
  <rect x="96" y="52" width="8" height="4" fill="#d97706"/>
  <rect x="100" y="56" width="8" height="8" fill="#d97706"/>
  <rect x="104" y="64" width="8" height="12" fill="#d97706"/>
  <rect x="108" y="76" width="8" height="8" fill="#d97706"/>
  <!-- Gear -->
  <rect x="112" y="72" width="4" height="12" fill="#94a3b8"/>
  <rect x="108" y="76" width="12" height="4" fill="#94a3b8"/>
  <rect x="114" y="78" width="4" height="4" fill="#475569"/>
  
  <!-- TENTACLE 8 (far right) - Holding Shield (security) -->
  <rect x="104" y="48" width="8" height="4" fill="#f59e0b"/>
  <rect x="108" y="52" width="8" height="8" fill="#f59e0b"/>
  <rect x="112" y="60" width="8" height="12" fill="#f59e0b"/>
  <rect x="116" y="72" width="8" height="8" fill="#f59e0b"/>
  <!-- Shield -->
  <rect x="118" y="56" width="8" height="12" fill="#22c55e"/>
  <rect x="120" y="54" width="4" height="2" fill="#22c55e"/>
  <rect x="120" y="68" width="4" height="4" fill="#22c55e"/>
  <rect x="122" y="72" width="2" height="2" fill="#22c55e"/>
  <!-- Checkmark on shield -->
  <rect x="120" y="62" width="2" height="2" fill="#ffffff"/>
  <rect x="122" y="60" width="2" height="4" fill="#ffffff"/>
  <rect x="124" y="58" width="2" height="2" fill="#ffffff"/>
</svg>
