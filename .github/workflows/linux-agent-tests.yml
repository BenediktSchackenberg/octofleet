name: Linux Agent Tests

on:
  push:
    paths:
      - 'linux-agent/**'
      - 'tests/linux-agent/**'
      - '.github/workflows/linux-agent-tests.yml'
  pull_request:
    paths:
      - 'linux-agent/**'
      - 'tests/linux-agent/**'
      - '.github/workflows/linux-agent-tests.yml'
  workflow_dispatch:

jobs:
  self-update:
    name: Shell syntax and self-update tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n linux-agent/agent.sh
          bash -n linux-agent/install.sh
      - name: Test check_for_update (success and failure paths)
        run: bash tests/linux-agent/self-update.test.sh
      - name: Test collect_updates with apt (version, suite, security flag)
        run: bash tests/linux-agent/apt-updates.test.sh
      - name: Test the mount list, used share and display adapter names
        run: bash tests/linux-agent/filesystems.test.sh
      - name: Test Linux job type handling
        run: bash tests/linux-agent/job-types.test.sh
      - name: Test the job types (run, inventory, restart-agent)
        run: bash tests/linux-agent/jobs.test.sh
      - name: Test the patch jobs (patch_scan, patch_install with apt, dnf, pacman)
        run: bash tests/linux-agent/patch-jobs.test.sh
      - name: Test the retry of a failed inventory push
        run: bash tests/linux-agent/push-retry.test.sh
      - name: Test the terminal and screen poll pacing (idle request rate, session start delay)
        run: bash tests/linux-agent/idle-polling.test.sh
      - name: Test the dnf/yum update list, security flags and reboot check
        run: bash tests/linux-agent/dnf-updates.test.sh
      - name: Test the pacman update list (installed version, repository, architecture)
        run: bash tests/linux-agent/pacman-updates.test.sh
      - name: Test the reboot job and the logged-on users
        run: bash tests/linux-agent/reboot.test.sh
      - name: Test the inventory push (numbers under mawk, broken sections, readable push errors)
        run: |
          sudo apt-get install -y -q mawk >/dev/null || true
          bash tests/linux-agent/inventory-push.test.sh
      - name: Test the inventory push under Debian 12's mawk (prints large numbers in exponent form)
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:bookworm-slim sh -c \
            'apt-get update -qq && apt-get install -y -qq jq >/dev/null && bash tests/linux-agent/inventory-push.test.sh'
      - name: Test the agent without a D-Bus system bus (polled transient units, plain errors)
        run: bash tests/linux-agent/no-dbus.test.sh
      - name: Test the logrotate configuration
        run: |
          sudo apt-get install -y -q logrotate >/dev/null || true
          bash tests/linux-agent/logrotate.test.sh
