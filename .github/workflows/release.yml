name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.7.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Test and package agent
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./tests/windows/Release-Package.Tests.ps1
          dotnet run --project tests/OctofleetAgent.Inventory.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Browser inventory regression tests failed' }
          ./scripts/Build-Release.ps1 -Version $env:RELEASE_VERSION -OutputPath ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./release/OctofleetAgent-v${{ steps.version.outputs.VERSION }}.zip
            ./release/OctofleetAgent-v${{ steps.version.outputs.VERSION }}.sha256
            ./Install-OctofleetAgent.ps1
          body: |
            ## Octofleet Windows Agent v${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Quick Install
            ```powershell
            irm https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/Install-OctofleetAgent.ps1 | iex
            ```

            The SHA256 checksum is included in the attached `.sha256` file.

      - name: Upload Artifact (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: OctofleetAgent-v${{ steps.version.outputs.VERSION }}
          path: |
            ./release/OctofleetAgent-v${{ steps.version.outputs.VERSION }}.zip
            ./release/OctofleetAgent-v${{ steps.version.outputs.VERSION }}.sha256
            ./Install-OctofleetAgent.ps1
