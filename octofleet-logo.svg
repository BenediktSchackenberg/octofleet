  <rect x="36" y="40" width="4" height="8" fill="#d97706"/>
  <rect x="38" y="48" width="4" height="8" fill="#d97706"/>
  
  <!-- Tentacle 6 -->
  <rect x="40" y="28" width="4" height="4" fill="#f59e0b"/>
  <rect x="42" y="32" width="4" height="8" fill="#f59e0b"/>
  <rect x="44" y="40" width="4" height="8" fill="#f59e0b"/>
  <rect x="46" y="48" width="4" height="6" fill="#f59e0b"/>
