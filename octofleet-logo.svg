  <rect x="26" y="40" width="4" height="8" fill="#f59e0b"/>
  <rect x="24" y="48" width="4" height="8" fill="#f59e0b"/>
  
  <!-- Tentacle 5 -->
  <rect x="34" y="28" width="4" height="4" fill="#d97706"/>
