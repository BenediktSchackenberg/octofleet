  <rect x="48" y="28" width="4" height="4" fill="#d97706"/>
  <rect x="50" y="32" width="4" height="8" fill="#d97706"/>
  <rect x="52" y="40" width="4" height="8" fill="#d97706"/>
  <rect x="50" y="48" width="4" height="4" fill="#d97706"/>
  
  <!-- Tentacle 8 (far right) -->
  <rect x="54" y="28" width="4" height="4" fill="#f59e0b"/>
  <rect x="56" y="32" width="4" height="4" fill="#f59e0b"/>
  <rect x="58" y="36" width="4" height="8" fill="#f59e0b"/>
