  <rect x="40" y="18" width="4" height="4" fill="#ffffff"/>
  <rect x="22" y="20" width="2" height="2" fill="#18181b"/>
  <rect x="40" y="20" width="2" height="2" fill="#18181b"/>
  
  <!-- 8 Tentacles -->
