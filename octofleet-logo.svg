  <rect x="8" y="28" width="4" height="4" fill="#d97706"/>
  <rect x="6" y="32" width="4" height="4" fill="#d97706"/>
  <rect x="4" y="36" width="4" height="8" fill="#d97706"/>
  <rect x="6" y="44" width="4" height="4" fill="#d97706"/>
  
  <!-- Tentacle 2 -->
  <rect x="14" y="28" width="4" height="4" fill="#f59e0b"/>
  <rect x="12" y="32" width="4" height="8" fill="#f59e0b"/>
  <rect x="10" y="40" width="4" height="8" fill="#f59e0b"/>
  <rect x="12" y="48" width="4" height="4" fill="#f59e0b"/>
  
  <!-- Tentacle 3 -->
  <rect x="22" y="28" width="4" height="4" fill="#d97706"/>
  <rect x="20" y="32" width="4" height="8" fill="#d97706"/>
  <rect x="18" y="40" width="4" height="8" fill="#d97706"/>
  <rect x="16" y="48" width="4" height="6" fill="#d97706"/>
  <rect x="18" y="54" width="4" height="4" fill="#d97706"/>
  
  <!-- Tentacle 4 -->
  <rect x="28" y="28" width="4" height="4" fill="#f59e0b"/>
