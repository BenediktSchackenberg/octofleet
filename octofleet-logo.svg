<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- 8-bit Pixel Art Octofleet Logo -->
  <!-- Background -->
  <rect width="64" height="64" fill="#18181b"/>
  
  <!-- Octopus Head (amber/orange) -->
  <rect x="24" y="8" width="16" height="4" fill="#f59e0b"/>
  <rect x="20" y="12" width="24" height="4" fill="#f59e0b"/>
  <rect x="16" y="16" width="32" height="8" fill="#f59e0b"/>
  <rect x="16" y="24" width="32" height="4" fill="#f59e0b"/>
  
  <!-- Eyes -->
