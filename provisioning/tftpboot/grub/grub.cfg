# Octofleet GRUB PXE Boot Configuration
# grub.cfg für Ubuntu NFS Boot

set timeout=5
set default=0

# PXE Server
set pxe_server="192.168.0.5"
set http_server="http://192.168.0.5:9080"

menuentry "Octofleet - Ubuntu 24.04 LTS (NFS)" {
    echo "Loading kernel..."
    linux (http,${pxe_server}:9080)/ubuntu-live/24.04/casper/vmlinuz \
        boot=casper \
        netboot=nfs \
        nfsroot=${pxe_server}:/mnt/ubuntu-24.04,tcp,vers=3 \
        ip=dhcp \
        autoinstall \
        ---
    
    echo "Loading initrd..."
    initrd (http,${pxe_server}:9080)/ubuntu-live/24.04/casper/initrd
    
    echo "Booting..."
}

menuentry "Octofleet - Ubuntu 22.04 LTS (NFS)" {
    echo "Loading kernel..."
    linux (http,${pxe_server}:9080)/ubuntu-live/22.04/casper/vmlinuz \
        boot=casper \
        netboot=nfs \
        nfsroot=${pxe_server}:/mnt/ubuntu-22.04,tcp,vers=3 \
        ip=dhcp \
        autoinstall \
        ---
    
    echo "Loading initrd..."
    initrd (http,${pxe_server}:9080)/ubuntu-live/22.04/casper/initrd
    
    echo "Booting..."
}

menuentry "Boot from local disk" {
    exit
}
