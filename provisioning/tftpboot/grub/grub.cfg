# Octofleet GRUB PXE Boot Configuration
# grub.cfg für Ubuntu NFS Boot

set timeout=5
set default=0

# PXE Server
set nfs_server="${NFS_HOST}"
set http_server="${PXE_SERVER_URL}"

menuentry "Octofleet - Ubuntu 24.04 LTS (NFS)" {
    echo "Loading kernel..."
    linux ${PXE_GRUB_BASE}/ubuntu-live/24.04/casper/vmlinuz \
        boot=casper \
        netboot=nfs \
        nfsroot=${nfs_server}:${NFS_PATH_2404},tcp,vers=3 \
        ip=dhcp \
        autoinstall \
        ---
    
    echo "Loading initrd..."
    initrd ${PXE_GRUB_BASE}/ubuntu-live/24.04/casper/initrd
    
    echo "Booting..."
}

menuentry "Octofleet - Ubuntu 22.04 LTS (NFS)" {
    echo "Loading kernel..."
    linux ${PXE_GRUB_BASE}/ubuntu-live/22.04/casper/vmlinuz \
        boot=casper \
        netboot=nfs \
        nfsroot=${nfs_server}:${NFS_PATH_2204},tcp,vers=3 \
        ip=dhcp \
        autoinstall \
        ---
    
    echo "Loading initrd..."
    initrd ${PXE_GRUB_BASE}/ubuntu-live/22.04/casper/initrd
    
    echo "Booting..."
}

menuentry "Boot from local disk" {
    exit
}
