# Octofleet PXE Server - dnsmasq ProxyDHCP Configuration
# Supports both iPXE (Windows) and GRUB (Linux)

# ============================================================
# PROXY DHCP MODE - Your DHCP stays active!
# ============================================================

# No DNS
port=0

# ProxyDHCP Mode - only responds with boot info, no IP assignment
dhcp-range=192.168.0.0,proxy

# ============================================================
# REGISTERED MACs - Only these get PXE Boot
# ============================================================
# Format: dhcp-host=MAC,set:pxe
# Dynamically loaded from /etc/hosts.pxe
conf-file=/etc/hosts.pxe

# Linux MACs get GRUB
# Add: dhcp-host=XX:XX:XX:XX:XX:XX,set:pxe,set:linux
conf-file=/etc/hosts-linux.pxe

# ============================================================
# PXE BOOT CONFIGURATION
# ============================================================

# BIOS PXE Boot (legacy)
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,tag:pxe,undionly.kpxe

# UEFI PXE Boot (x64) - Default: iPXE for Windows
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9

# Linux clients get GRUB instead of iPXE
dhcp-boot=tag:efi64,tag:linux,grub/grubnetx64.efi
dhcp-boot=tag:bios,tag:linux,grub/grubnetx64.efi

# Windows clients get iPXE
dhcp-boot=tag:efi64,tag:pxe,ipxe.efi

# iPXE userclass detection and chainload
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,tag:pxe,http://${PXE_SERVER_IP}:9080/boot.ipxe

# ============================================================
# TFTP SERVER
# ============================================================
enable-tftp
tftp-root=/tftpboot
tftp-secure

# ============================================================
# LOGGING
# ============================================================
log-dhcp
log-queries
log-facility=-
