worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;
    
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    server {
        listen ${PXE_HTTP_PORT};
        server_name _;
        
        # Proxy API requests to backend
        location /api/ {
            proxy_pass ${OCTOFLEET_API}/api/;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Boot scripts
        location /boot.ipxe {
            alias ${TFTP_ROOT}/boot.ipxe;
            add_header Content-Type text/plain;
        }
        
        # Test boot scripts
        location /ubuntu-test.ipxe {
            alias ${TFTP_ROOT}/ubuntu-test.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-menu.ipxe {
            alias ${TFTP_ROOT}/ubuntu-menu.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-nfs-v2.ipxe {
            alias ${TFTP_ROOT}/ubuntu-nfs-v2.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-nfs-v3.ipxe {
            alias ${TFTP_ROOT}/ubuntu-nfs-v3.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-nfs-v4.ipxe {
            alias ${TFTP_ROOT}/ubuntu-nfs-v4.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-debug.ipxe {
            alias ${TFTP_ROOT}/ubuntu-debug.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /universal-boot.ipxe {
            alias ${TFTP_ROOT}/universal-boot.ipxe;
            add_header Content-Type text/plain;
        }
        
        # Dynamic boot script per MAC
        location ~ ^/boot/(.+)\.ipxe$ {
            alias ${PROVISIONING_BOOT_PATH}/$1.ipxe;
            add_header Content-Type text/plain;
        }
        
        # WinPE files
        location /winpe/ {
            alias ${PROVISIONING_IMAGES_PATH}/winpe/;
            autoindex on;
        }
        
        # OS Images (WIM, ISO)
        location /images/ {
            alias ${PROVISIONING_IMAGES_PATH}/;
            autoindex on;
        }
        
        # Ubuntu Live ISOs for PXE boot
        location ~ ^/ubuntu-live/([0-9]+\.[0-9]+)/(.*)$ {
            alias ${PROVISIONING_MOUNT_BASE}/ubuntu-$1/$2;
        }

        # Autoinstall cloud-config for Ubuntu
        location /autoinstall/ {
            proxy_pass ${OCTOFLEET_API}/api/v1/pxe/autoinstall/;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Drivers
        location /drivers/ {
            alias ${PROVISIONING_DRIVERS_PATH}/;
            autoindex on;
        }
        
        # Autounattend.xml files
        location /answers/ {
            alias ${PROVISIONING_ANSWERS_PATH}/;
            autoindex on;
        }
        
        # Scripts (Install-OctofleetAgent.ps1, etc.)
        location /scripts/ {
            alias ${PROVISIONING_SCRIPTS_PATH}/;
            autoindex on;
        }
        
        # GRUB boot files
        location /grub/ {
            alias ${TFTP_ROOT}/grub/;
            autoindex on;
        }
        
        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        
        # Status page
        location = / {
            return 200 '🐙 Octofleet PXE Server';
            add_header Content-Type text/plain;
        }
        # WinPE 2022 files
        location /winpe-2022/ {
            alias ${PROVISIONING_IMAGES_PATH}/winpe-2022/;
            autoindex on;
        }
        
        # WinPE 2022 Custom (with startnet.cmd)
        location /winpe-2022-custom/ {
            alias ${PROVISIONING_IMAGES_PATH}/winpe-2022-custom/;
            autoindex on;
        }
        
        # WinPE 2022 Auto (with embedded Autounattend)
        location /winpe-2022-auto/ {
            alias ${PROVISIONING_IMAGES_PATH}/winpe-2022-auto/;
            autoindex on;
        }
        
        # Windows Install files (full ISO content)
        location /wininstall/ {
            alias ${PROVISIONING_WINDOWS_INSTALL_PATH}/;
            autoindex on;
        }
    }
}
