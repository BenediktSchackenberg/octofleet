worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;
    
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    server {
        listen 9080;
        server_name _;
        
        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://192.168.0.5:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Boot scripts
        location /boot.ipxe {
            alias /tftpboot/boot.ipxe;
            add_header Content-Type text/plain;
        }
        
        # Test boot scripts
        location /ubuntu-test.ipxe {
            alias /tftpboot/ubuntu-test.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-menu.ipxe {
            alias /tftpboot/ubuntu-menu.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-nfs-v2.ipxe {
            alias /tftpboot/ubuntu-nfs-v2.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-nfs-v3.ipxe {
            alias /tftpboot/ubuntu-nfs-v3.ipxe;
            add_header Content-Type text/plain;
        }
        
        location /ubuntu-nfs-v4.ipxe {
            alias /tftpboot/ubuntu-nfs-v4.ipxe;
            add_header Content-Type text/plain;
        }
        
        # Dynamic boot script per MAC
        location ~ ^/boot/(.+)\.ipxe$ {
            alias /srv/boot/$1.ipxe;
            add_header Content-Type text/plain;
        }
        
        # WinPE files
        location /winpe/ {
            alias /srv/images/winpe/;
            autoindex on;
        }
        
        # OS Images (WIM, ISO)
        location /images/ {
            alias /srv/images/;
            autoindex on;
        }
        
        # Ubuntu Live ISOs for PXE boot
        location /ubuntu-live/24.04/ {
            alias /mnt/ubuntu-24.04/;
            autoindex on;
        }
        
        location /ubuntu-live/22.04/ {
            alias /mnt/ubuntu-22.04/;
            autoindex on;
        }
        
        # Autoinstall cloud-config for Ubuntu
        location /autoinstall/ {
            proxy_pass http://192.168.0.5:8080/api/v1/provisioning/autoinstall/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Drivers
        location /drivers/ {
            alias /srv/drivers/;
            autoindex on;
        }
        
        # Autounattend.xml files
        location /answers/ {
            alias /srv/answers/;
            autoindex on;
        }
        
        # Scripts (Install-OctofleetAgent.ps1, etc.)
        location /scripts/ {
            alias /srv/scripts/;
            autoindex on;
        }
        
        # GRUB boot files
        location /grub/ {
            alias /tftpboot/grub/;
            autoindex on;
        }
        
        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        
        # Status page
        location = / {
            return 200 '🐙 Octofleet PXE Server';
            add_header Content-Type text/plain;
        }
    }
}
